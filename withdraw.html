<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdraw — EdgeLvl</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg:#fafaf9; --fg:#111; --dim:#666; --line:#e5e5e3; --field:#fff;
          --green:#16a34a; --red:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e0e; --fg:#f2f2f2; --dim:#8a8a8a; --line:#242424; --field:#161616; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
         display:flex; justify-content:center; padding:6vh 16px; }
  .card { width:100%; max-width:460px; }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; }
  .lede { color:var(--dim); margin:0 0 26px; }
  label { display:block; color:var(--dim); margin:18px 0 6px; font-size:11px;
          letter-spacing:.08em; text-transform:uppercase; }
  input { width:100%; background:var(--field); border:1px solid var(--line);
          color:var(--fg); padding:12px 13px; border-radius:7px; font:inherit; }
  input:focus { outline:none; border-color:var(--green); }
  button { width:100%; margin-top:18px; padding:13px; border:0; border-radius:7px;
           background:var(--fg); color:var(--bg); font:inherit; font-weight:600;
           cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; justify-content:space-between; gap:12px;
         padding:11px 0; border-bottom:1px solid var(--line); }
  .row span:last-child { color:var(--dim); word-break:break-all; text-align:right; }
  .msg { margin-top:16px; padding:11px 13px; border-radius:7px;
         background:var(--field); border:1px solid var(--line); word-break:break-word; }
  .msg.bad { border-color:var(--red); color:var(--red); }
  .msg.good { border-color:var(--green); color:var(--green); }
  a { color:inherit; }
  .back { display:inline-block; margin-top:26px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<!-- The terminal cannot sign these withdrawals and neither can the server:
     the wallets are held on Privy's servers, our own key is confined by policy
     to swaps, and Privy will not mint a user signing key from an access token
     for an app on native auth. Their client SDK can, so this page uses it.

     Bundled rather than imported from a CDN — esm.sh served React twice, which
     kills every hook, and timed out building the dependency graph. -->
<div class="card" id="root">Loading…</div>
<script src="/withdraw.bundle.js"></script>
</body>
</html>
