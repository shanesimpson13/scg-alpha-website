<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCG Alpha — The Vault</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, 'Cascadia Code', 'Courier New', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas#starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .logo {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 10;
    }

    .logo a {
      display: block;
    }

    .logo img {
      width: 100px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .social-links {
      position: fixed;
      bottom: 28px;
      right: 32px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .social-links a {
      opacity: 0.4;
      transition: opacity 0.3s;
    }

    .social-links a:hover {
      opacity: 1;
    }

    .social-links svg {
      width: 24px;
      height: 24px;
    }

    .social-links svg.x-icon {
      width: 20px;
      height: 20px;
    }

    .vault-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 120px 24px 120px;
    }

    .vault-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-align: center;
    }

    .vault-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      margin-bottom: 48px;
      letter-spacing: 0.5px;
    }

    /* Loading / Empty states */
    .status-msg {
      text-align: center;
      padding: 80px 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .status-msg.pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Token Cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      object-fit: cover;
    }

    .card-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .card-mint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-left: 8px;
      letter-spacing: 0;
    }

    .card-max-return {
      font-size: 11px;
      color: #00c853;
      margin-left: 10px;
      letter-spacing: 0;
    }

    .card-score {
      margin-left: auto;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .score-green  { background: rgba(0, 200, 83, 0.15); color: #00c853; }
    .score-yellow { background: rgba(255, 214, 0, 0.15); color: #ffd600; }
    .score-orange { background: rgba(255, 152, 0, 0.15); color: #ff9800; }
    .score-red    { background: rgba(244, 67, 54, 0.15); color: #f44336; }

    .card-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 20px;
      margin-bottom: 14px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .metric-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
    }

    .metric-value.positive { color: #00c853; }
    .metric-value.negative { color: #f44336; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-twitter {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
    }

    .card-twitter a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
    }

    .card-twitter a:hover {
      color: #fff;
    }

    .card-buy-link {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      letter-spacing: 0.8px;
      padding: 5px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s;
    }

    .card-buy-link:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 16px;
    }

    /* Recap Section */
    .recap {
      margin-bottom: 48px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .recap-title {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 20px;
      text-align: center;
    }

    .recap-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      text-align: center;
    }

    .recap-stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .recap-stat-value {
      font-size: 16px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .logo {
        top: 16px;
        left: 16px;
      }

      .logo img {
        width: 72px;
      }

      .vault-wrapper {
        padding: 90px 16px 100px;
      }

      .vault-title {
        font-size: 15px;
        margin-bottom: 8px;
      }

      .vault-subtitle {
        font-size: 11px;
        margin-bottom: 32px;
      }

      .card {
        padding: 16px;
      }

      .card-metrics {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 16px;
      }

      .recap-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .social-links {
        bottom: 20px;
        right: 20px;
      }

      .social-links svg {
        width: 20px;
        height: 20px;
      }

      .social-links svg.x-icon {
        width: 17px;
        height: 17px;
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="content">
    <div class="logo">
      <a href="index.html"><img src="scg-logo.png" alt="SCG Alpha"></a>
    </div>
    <div class="social-links">
      <a href="https://x.com/scg_alpha" target="_blank" rel="noopener" aria-label="X">
        <svg class="x-icon" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
      <a href="https://t.me/scg_alpha" target="_blank" rel="noopener" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.946 9.315c5.223-2.279 8.705-3.781 10.447-4.508 4.975-2.07 6.009-2.43 6.685-2.442.148-.003.48.034.695.21.181.148.231.348.255.488.024.14.054.458.03.707-.27 2.845-1.44 9.744-2.036 12.929-.252 1.348-.748 1.8-1.228 1.844-1.044.096-1.837-.69-2.848-1.353-1.584-1.039-2.479-1.685-4.015-2.699-1.776-1.17-.625-1.814.388-2.866.265-.276 4.869-4.464 4.959-4.843.011-.047.022-.224-.083-.317-.106-.093-.262-.061-.374-.036-.16.036-2.688 1.708-7.588 5.015-.718.493-1.368.734-1.952.72-.643-.013-1.878-.363-2.797-.661-1.127-.367-2.023-.56-1.945-1.183.04-.324.487-.656 1.34-.994z"/>
        </svg>
      </a>
    </div>
    <div class="vault-wrapper">
      <h1 class="vault-title">The Vault</h1>
      <p class="vault-subtitle">Live signal dashboard — scored, tracked, transparent</p>

      <div class="section-label">ACTIVE SIGNALS</div>
      <div id="active-cards" class="cards">
        <div class="status-msg pulse">Scanning...</div>
      </div>

      <div id="completed-section" style="display:none;">
        <div class="section-label" style="margin-top: 48px;">COMPLETED</div>
        <div id="recap" class="recap">
          <div class="recap-grid">
            <div>
              <div class="recap-stat-label">Total Calls</div>
              <div class="recap-stat-value" id="recap-total">—</div>
            </div>
            <div>
              <div class="recap-stat-label">Win Rate</div>
              <div class="recap-stat-value" id="recap-winrate">—</div>
            </div>
            <div>
              <div class="recap-stat-label">Avg ROI</div>
              <div class="recap-stat-value" id="recap-roi">—</div>
            </div>
            <div>
              <div class="recap-stat-label">Best</div>
              <div class="recap-stat-value" id="recap-best">—</div>
            </div>
            <div>
              <div class="recap-stat-label">Worst</div>
              <div class="recap-stat-value" id="recap-worst">—</div>
            </div>
          </div>
        </div>
        <div id="completed-cards" class="cards"></div>
      </div>
    </div>
  </div>

  <script>
    // ── Starfield ──────────────────────────────────────────────────
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const NUM_STARS = 120;
    const stars = [];
    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.1 + 0.3,
        baseAlpha: Math.random() * 0.35 + 0.15,
        twinkleSpeed: Math.random() * 0.005 + 0.001,
        twinkleOffset: Math.random() * Math.PI * 2,
      });
    }

    const shootingStars = [];

    function spawnShootingStar() {
      const startX = Math.random() * W * 0.5;
      const startY = H * 0.5 + Math.random() * H * 0.5;
      const angle = -(Math.PI / 6 + Math.random() * Math.PI / 6);
      shootingStars.push({
        x: startX, y: startY, angle: angle,
        speed: 8 + Math.random() * 10,
        length: 60 + Math.random() * 100,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.012,
      });
    }

    let lastShootingStarTime = 0;

    function animate(time) {
      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        const alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, Math.min(1, alpha))})`;
        ctx.fill();
      }

      if (time - lastShootingStarTime > 2000 + Math.random() * 3000) {
        spawnShootingStar();
        lastShootingStarTime = time;
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += Math.cos(ss.angle) * ss.speed;
        ss.y += Math.sin(ss.angle) * ss.speed;
        ss.life -= ss.decay;

        if (ss.life <= 0 || ss.x > W + 100 || ss.x < -100 || ss.y < -100 || ss.y > H + 100) {
          shootingStars.splice(i, 1);
          continue;
        }

        const tailX = ss.x - Math.cos(ss.angle) * ss.length;
        const tailY = ss.y - Math.sin(ss.angle) * ss.length;
        const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
        grad.addColorStop(0, `rgba(255, 255, 255, 0)`);
        grad.addColorStop(1, `rgba(255, 255, 255, ${ss.life * 0.9})`);
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(ss.x, ss.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${ss.life})`;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      for (const s of stars) {
        s.x = Math.random() * W;
        s.y = Math.random() * H;
      }
    });

    // ── Dashboard Data ─────────────────────────────────────────────
    const API_URL = 'https://api.scgalpha.com/api/alerts';
    const activeCardsEl = document.getElementById('active-cards');
    const completedCardsEl = document.getElementById('completed-cards');
    const completedSection = document.getElementById('completed-section');
    const recapEl = document.getElementById('recap');

    function scoreClass(score) {
      if (score >= 80) return 'score-green';
      if (score >= 60) return 'score-yellow';
      if (score >= 40) return 'score-orange';
      return 'score-red';
    }

    function fmtMcap(n) {
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
      return '$' + n.toFixed(0);
    }

    function fmtPct(n) {
      const sign = n >= 0 ? '+' : '';
      return sign + n.toFixed(1) + '%';
    }

    function renderCard(a) {
      const retClass = a.return_pct >= 0 ? 'positive' : 'negative';
      const logoSrc = a.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="36" height="36" fill="%23222"/></svg>';
      const mintShort = a.mint.slice(0, 6) + '...' + a.mint.slice(-4);
      const gmgnLink = 'https://gmgn.ai/sol/token/' + a.mint;

      let twitterHtml = '';
      if (a.twitter_handle) {
        twitterHtml = `<a href="https://x.com/${a.twitter_handle}" target="_blank">@${a.twitter_handle}</a> (${a.twitter_followers.toLocaleString()})`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <img class="card-logo" src="${logoSrc}" alt="" onerror="this.style.display='none'">
            <span class="card-name">${a.name}<span class="card-mint">${mintShort}</span>${a.max_return_pct > 0 ? `<span class="card-max-return">ATH +${a.max_return_pct.toFixed(1)}%</span>` : ''}</span>
            <span class="card-score ${scoreClass(a.score)}">${a.score}</span>
          </div>
          <div class="card-metrics">
            <div class="metric">
              <span class="metric-label">MC @ Signal</span>
              <span class="metric-value">${fmtMcap(a.alert_mcap)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">MC Current</span>
              <span class="metric-value">${fmtMcap(a.current_mcap)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Return</span>
              <span class="metric-value ${retClass}">${fmtPct(a.return_pct)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Age</span>
              <span class="metric-value">${a.age_mins}m</span>
            </div>
            <div class="metric">
              <span class="metric-label">Holders</span>
              <span class="metric-value">${a.holders.toLocaleString()}</span>
            </div>
            <div class="metric">
              <span class="metric-label">B/S Ratio</span>
              <span class="metric-value">${a.bs_ratio}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Bot Degen</span>
              <span class="metric-value">${a.bot_degen_pct}%</span>
            </div>
            <div class="metric">
              <span class="metric-label">Holder Growth</span>
              <span class="metric-value positive">+${a.holder_growth_pct}%</span>
            </div>
            <div class="metric">
              <span class="metric-label">Liquidity</span>
              <span class="metric-value">${fmtMcap(a.liquidity)}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Bundler</span>
              <span class="metric-value">${a.bundler_pct}%</span>
            </div>
            <div class="metric">
              <span class="metric-label">KOL</span>
              <span class="metric-value">${a.kol_count}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Signals</span>
              <span class="metric-value">${a.signal_count || 0}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Degen Calls</span>
              <span class="metric-value">${a.degen_call_count || 0}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Rug Ratio</span>
              <span class="metric-value">${a.rug_ratio}</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="card-twitter">${twitterHtml}</span>
            <a href="${gmgnLink}" target="_blank" class="card-buy-link">BUY ON GMGN</a>
          </div>
        </div>
      `;
    }

    function renderRecap(recap) {
      if (!recap || recap.total === 0) {
        recapEl.style.display = 'none';
        return;
      }
      recapEl.style.display = '';
      document.getElementById('recap-total').textContent = recap.total;
      document.getElementById('recap-winrate').textContent = recap.win_rate + '%';

      const roiEl = document.getElementById('recap-roi');
      roiEl.textContent = fmtPct(recap.avg_roi);
      roiEl.style.color = recap.avg_roi >= 0 ? '#00c853' : '#f44336';

      const bestEl = document.getElementById('recap-best');
      if (recap.best_trade) {
        bestEl.textContent = recap.best_trade.name + ' ' + fmtPct(recap.best_trade.pct);
        bestEl.style.color = '#00c853';
      }

      const worstEl = document.getElementById('recap-worst');
      if (recap.worst_trade) {
        worstEl.textContent = recap.worst_trade.name + ' ' + fmtPct(recap.worst_trade.pct);
        worstEl.style.color = '#f44336';
      }
    }

    async function fetchAlerts() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const active = (data.alerts || []).filter(a => !a.completed);
        const completed = (data.alerts || []).filter(a => a.completed);

        if (active.length > 0) {
          activeCardsEl.innerHTML = active.map(renderCard).join('');
        } else {
          activeCardsEl.innerHTML = '<div class="status-msg">No active signals</div>';
        }

        if (completed.length > 0 || (data.recap && data.recap.total > 0)) {
          completedSection.style.display = '';
          completedCardsEl.innerHTML = completed.map(renderCard).join('');
          renderRecap(data.recap);
        } else {
          completedSection.style.display = 'none';
        }
      } catch (e) {
        if (activeCardsEl.querySelector('.pulse')) {
          activeCardsEl.innerHTML = '<div class="status-msg pulse">Scanning...</div>';
        }
      }
    }

    // Initial fetch + poll every 30s
    fetchAlerts();
    setInterval(fetchAlerts, 30000);
  </script>
</body>
</html>
