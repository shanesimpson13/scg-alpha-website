<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCG Alpha — Vault</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, 'Cascadia Code', 'Courier New', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas#starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    .logo {
      position: fixed;
      top: 28px;
      left: 32px;
    }

    .logo a {
      display: block;
    }

    .logo img {
      width: 100px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .social-links {
      position: fixed;
      bottom: 28px;
      right: 32px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .social-links a {
      opacity: 0.4;
      transition: opacity 0.3s;
    }

    .social-links a:hover {
      opacity: 1;
    }

    .social-links svg {
      width: 24px;
      height: 24px;
    }

    .social-links svg.x-icon {
      width: 20px;
      height: 20px;
    }

    .vault-wrapper {
      max-width: 640px;
      margin: 0 auto;
      padding: 120px 24px 100px;
    }

    .vault-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 56px;
      text-align: center;
    }

    .section-label {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .vault-list {
      list-style: none;
      margin-bottom: 48px;
    }

    .vault-list li {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.3px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vault-list li:last-child {
      border-bottom: none;
    }

    .status {
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
    }

    .vault-footer {
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vault-footer a {
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      transition: color 0.3s;
    }

    .vault-footer a:hover {
      color: #fff;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 48px;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      .logo {
        top: 16px;
        left: 16px;
      }

      .logo img {
        width: 72px;
      }

      .vault-wrapper {
        padding: 100px 16px 80px;
      }

      .vault-title {
        font-size: 16px;
      }

      .vault-list li {
        font-size: 13px;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="content">
    <div class="logo">
      <a href="index.html"><img src="scg-logo.png" alt="SCG Alpha"></a>
    </div>
    <div class="social-links">
      <a href="https://x.com/scg_alpha" target="_blank" rel="noopener" aria-label="X">
        <svg class="x-icon" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
      <a href="https://t.me/scg_alpha" target="_blank" rel="noopener" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.946 9.315c5.223-2.279 8.705-3.781 10.447-4.508 4.975-2.07 6.009-2.43 6.685-2.442.148-.003.48.034.695.21.181.148.231.348.255.488.024.14.054.458.03.707-.27 2.845-1.44 9.744-2.036 12.929-.252 1.348-.748 1.8-1.228 1.844-1.044.096-1.837-.69-2.848-1.353-1.584-1.039-2.479-1.685-4.015-2.699-1.776-1.17-.625-1.814.388-2.866.265-.276 4.869-4.464 4.959-4.843.011-.047.022-.224-.083-.317-.106-.093-.262-.061-.374-.036-.16.036-2.688 1.708-7.588 5.015-.718.493-1.368.734-1.952.72-.643-.013-1.878-.363-2.797-.661-1.127-.367-2.023-.56-1.945-1.183.04-.324.487-.656 1.34-.994z"/>
        </svg>
      </a>
    </div>
    <div class="vault-wrapper">
      <a href="index.html" class="back-link">&larr; Back</a>
      <h1 class="vault-title">SCG Alpha Vault</h1>

      <p class="section-label">Strategy Validation</p>
      <ul class="vault-list">
        <li><span>Pump.fun Sniper</span><span class="status">Testing</span></li>
        <li><span>Hyperliquid Perps</span><span class="status">Research</span></li>
        <li><span>Dev Wallet Strategy</span><span class="status">Development</span></li>
      </ul>

      <p class="section-label">Research Notes</p>
      <ul class="vault-list">
        <li><span>Pump.fun Launch Mechanics</span></li>
        <li><span>On-chain Liquidity Migration</span></li>
        <li><span>Crypto Market Structure</span></li>
      </ul>

      <div class="vault-footer">
        <a href="https://x.com/scg_alpha" target="_blank" rel="noopener">Follow live strategy updates on X &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const NUM_STARS = 120;
    const stars = [];
    for (let i = 0; i < NUM_STARS; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.1 + 0.3,
        baseAlpha: Math.random() * 0.35 + 0.15,
        twinkleSpeed: Math.random() * 0.005 + 0.001,
        twinkleOffset: Math.random() * Math.PI * 2,
      });
    }

    const shootingStars = [];

    function spawnShootingStar() {
      const startX = Math.random() * W * 0.5;
      const startY = H * 0.5 + Math.random() * H * 0.5;
      const angle = -(Math.PI / 6 + Math.random() * Math.PI / 6);
      shootingStars.push({
        x: startX, y: startY, angle: angle,
        speed: 8 + Math.random() * 10,
        length: 60 + Math.random() * 100,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.012,
      });
    }

    let lastShootingStarTime = 0;

    function animate(time) {
      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        const alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, Math.min(1, alpha))})`;
        ctx.fill();
      }

      if (time - lastShootingStarTime > 2000 + Math.random() * 3000) {
        spawnShootingStar();
        lastShootingStarTime = time;
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += Math.cos(ss.angle) * ss.speed;
        ss.y += Math.sin(ss.angle) * ss.speed;
        ss.life -= ss.decay;

        if (ss.life <= 0 || ss.x > W + 100 || ss.x < -100 || ss.y < -100 || ss.y > H + 100) {
          shootingStars.splice(i, 1);
          continue;
        }

        const tailX = ss.x - Math.cos(ss.angle) * ss.length;
        const tailY = ss.y - Math.sin(ss.angle) * ss.length;
        const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
        grad.addColorStop(0, `rgba(255, 255, 255, 0)`);
        grad.addColorStop(1, `rgba(255, 255, 255, ${ss.life * 0.9})`);
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(ss.x, ss.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${ss.life})`;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      for (const s of stars) {
        s.x = Math.random() * W;
        s.y = Math.random() * H;
      }
    });
  </script>
</body>
</html>
